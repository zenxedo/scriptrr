<div id="schedule-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
  <div class="bg-[#1a1a1e] border border-[#23232a] rounded-lg shadow-2xl w-full max-w-md flex flex-col">
    
    <!-- Header -->
    <div class="px-6 py-4 border-b border-[#23232a] flex justify-between items-center">
      <h2 class="text-lg font-semibold text-white flex items-center gap-2">
        <i data-lucide="clock" class="w-5 h-5 text-blue-500"></i> Edit Schedule
      </h2>
      <button onclick="closeScheduleModal()" class="text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    
    <form hx-post="" id="schedule-form" hx-target="#script-rows" onsubmit="closeScheduleModal()" class="p-6 flex flex-col gap-4">
      <div>
        <h3 id="schedule-script-name" class="text-sm font-medium text-gray-400 mb-3 uppercase tracking-wider"></h3>
        <input type="text" id="schedule-input" name="schedule" placeholder="* * * * * (Cron expression)" class="w-full bg-[#121214] border border-[#23232a] rounded px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none focus:border-blue-600 mb-3" />
        
        <div class="flex flex-wrap gap-2 mb-4">
          <button type="button" onclick="document.getElementById('schedule-input').value='*/5 * * * *'" class="bg-[#23232a] hover:bg-[#2b2b35] border border-gray-700 text-[11px] text-gray-300 px-2 py-1 rounded transition">Every 5m</button>
          <button type="button" onclick="document.getElementById('schedule-input').value='0 * * * *'" class="bg-[#23232a] hover:bg-[#2b2b35] border border-gray-700 text-[11px] text-gray-300 px-2 py-1 rounded transition">Hourly</button>
          <button type="button" onclick="document.getElementById('schedule-input').value='0 9 * * *'" class="bg-[#23232a] hover:bg-[#2b2b35] border border-gray-700 text-[11px] text-gray-300 px-2 py-1 rounded transition">Daily 9 AM</button>
          <button type="button" onclick="document.getElementById('schedule-input').value='30 8 * * 1-5'" class="bg-[#23232a] hover:bg-[#2b2b35] border border-gray-700 text-[11px] text-gray-300 px-2 py-1 rounded transition">Weekdays 8:30 AM</button>
          <button type="button" onclick="document.getElementById('schedule-input').value='0 0 * * 0'" class="bg-[#23232a] hover:bg-[#2b2b35] border border-gray-700 text-[11px] text-gray-300 px-2 py-1 rounded transition">Sundays Midnight</button>
          <button type="button" onclick="document.getElementById('schedule-input').value=''" class="bg-rose-900/20 hover:bg-rose-900/40 border border-rose-800/50 text-[11px] text-rose-400 px-2 py-1 rounded transition">Clear Schedule</button>
        </div>
        
        <a href="https://crontab.guru" target="_blank" rel="noopener" class="text-xs text-blue-400 hover:text-blue-300 underline flex items-center gap-1">
          Need help? crontab.guru <i data-lucide="external-link" class="w-3 h-3"></i>
        </a>
      </div>
      
      <div class="pt-2 flex justify-end gap-3 border-t border-[#23232a] mt-2 pt-4">
        <button type="button" onclick="closeScheduleModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded transition flex items-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i> Save
        </button>
      </div>
    </form>
    
  </div>
</div>
