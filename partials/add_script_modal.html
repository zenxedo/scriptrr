<div id="add-script-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
  <div class="bg-[#1a1a1e] border border-[#23232a] rounded-lg shadow-2xl w-full max-w-3xl flex flex-col max-h-[90vh]">
    
    <!-- Header -->
    <div class="px-6 py-4 border-b border-[#23232a] flex justify-between items-center shrink-0">
      <h2 class="text-lg font-semibold text-white flex items-center gap-2">
        <i data-lucide="file-code" class="w-5 h-5 text-blue-500"></i> New Script
      </h2>
      <button onclick="document.getElementById('add-script-modal').classList.add('hidden')" class="text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    
    <div class="p-6 overflow-y-auto flex-1 flex flex-col gap-6">
      
      <!-- Upload Section -->
      <div class="bg-[#121214] border border-[#23232a] p-4 rounded-md flex justify-between items-center">
        <div>
          <h3 class="text-sm font-medium text-gray-200">Upload Existing File</h3>
          <p class="text-xs text-gray-500 mt-1">Select a .py or .sh file from your machine.</p>
        </div>
        <form id="add-upload-form" enctype="multipart/form-data" hx-encoding="multipart/form-data" hx-post="/v2/api/script/upload" hx-target="#script-rows" hx-on="htmx:afterRequest: document.getElementById('add-script-modal').classList.add('hidden'); document.getElementById('add-upload-form').reset();">
          <input type="file" id="script-upload" name="file" accept=".py,.sh" class="hidden" onchange="if(this.files.length) htmx.trigger(this.form, 'submit')" />
          <button type="button" onclick="document.getElementById('script-upload').click()" class="bg-blue-600/10 text-blue-400 border border-blue-500/20 hover:bg-blue-600/30 px-4 py-2 rounded text-sm font-medium transition flex items-center gap-2">
            <i data-lucide="upload" class="w-4 h-4"></i> Browse Files
          </button>
        </form>
      </div>

      <div class="flex items-center text-xs text-gray-600 uppercase font-bold tracking-wider gap-4">
        <div class="flex-1 border-t border-[#23232a]"></div>
        OR CREATE MANUALLY
        <div class="flex-1 border-t border-[#23232a]"></div>
      </div>

      <!-- Manual Creation Form -->
      <form id="add-script-form" hx-post="/v2/api/script/create" hx-target="#script-rows" hx-on="htmx:afterRequest: document.getElementById('add-script-modal').classList.add('hidden'); document.getElementById('add-script-form').reset();" class="flex flex-col gap-4">
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-xs font-semibold text-gray-400 mb-1.5">Filename (e.g., scan.py)</label>
            <input type="text" name="filename" required placeholder="script_name.py" class="w-full bg-[#121214] border border-[#23232a] rounded px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-600" />
          </div>
          <div class="flex-1">
            <label class="block text-xs font-semibold text-gray-400 mb-1.5">Description (Optional)</label>
            <input type="text" name="description" placeholder="What does this do?" class="w-full bg-[#121214] border border-[#23232a] rounded px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-600" />
          </div>
        </div>
        
        <div class="flex-1 min-h-[250px] flex flex-col">
          <label class="block text-xs font-semibold text-gray-400 mb-1.5">Script Content</label>
          <textarea name="content" required placeholder="#!/usr/bin/env python3&#10;print('Hello World')" class="w-full flex-1 bg-[#121214] border border-[#23232a] rounded px-3 py-2 text-sm font-mono text-gray-200 focus:outline-none focus:border-blue-600 resize-y min-h-[250px]"></textarea>
        </div>
        
        <div class="pt-2 flex justify-end gap-3 mt-auto">
          <button type="button" onclick="document.getElementById('add-script-modal').classList.add('hidden')" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded transition flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Save Script
          </button>
        </div>
      </form>
      
    </div>
  </div>
</div>
